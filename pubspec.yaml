name: quizzical
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  html_unescape: ^2.0.0
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/congratulations.png
    - assets/images/try_again.webp
    - assets/images/quiz.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/quiz.jpg"
  min_sdk_android: 21